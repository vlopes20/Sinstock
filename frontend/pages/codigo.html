<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Código de Verificação | SINSTOCK</title>
    <link rel="stylesheet" href="../assets/styles/autenticacao.css" />
    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/auth/session.js"></script>
    <script src="../js/auth/mfa.js" defer></script>
  </head>
  <body class="bg-white text-gray-900 font-sans antialiased min-h-screen">
    <main
      class="auth-page relative grid grid-cols-1 lg:grid-cols-[42%_58%] w-full min-h-screen overflow-hidden"
    >
      <!-- LADO ESQUERDO (FORMULÁRIO) -->
      <section
        class="auth-panel relative w-full min-h-screen flex items-center justify-center px-8 lg:px-[70px] bg-white z-20"
      >
        <!-- SELETOR DE IDIOMA -->
        <div
          class="auth-language absolute top-7 left-[35px] flex items-center gap-2.5 text-base font-medium cursor-pointer text-gray-900"
        >
          <span>Português (BR)</span>
          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </div>

        <!-- CONTAINER PRINCIPAL -->
        <div class="auth-content w-full max-w-[445px] my-auto">
          <!-- ÍCONE DE DESTAQUE -->
          <div
            class="w-[70px] h-[70px] rounded-full bg-[#ff6200]/10 flex items-center justify-center mb-6"
          >
            <svg
              class="w-9 h-9 text-[#ff6200]"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
              <path d="m9 12 2 2 4-4" />
            </svg>
          </div>

          <div class="mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900">
              Digite o Código
            </h1>
            <p class="mt-3 text-gray-600 text-base leading-relaxed">
              Digite o código de 6 dígitos do seu aplicativo autenticador para
              concluir o login.
            </p>
          </div>

          <form id="codeForm" class="space-y-6">
            <!-- CAMPOS DE CÓDIGO (6 DÍGITOS) -->
            <div>
              <label class="block mb-3 text-base font-medium text-gray-700"
                >Código de Confirmação</label
              >
              <div class="grid grid-cols-6 gap-2 sm:gap-3" id="otpContainer">
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  class="otp-input w-full h-14 sm:h-16 text-center text-2xl font-bold border border-gray-300 rounded-lg bg-white text-gray-900 outline-none focus:border-[#ff6200] focus:ring-4 focus:ring-[#ff6200]/10 transition-all"
                  required
                  autofocus
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  class="otp-input w-full h-14 sm:h-16 text-center text-2xl font-bold border border-gray-300 rounded-lg bg-white text-gray-900 outline-none focus:border-[#ff6200] focus:ring-4 focus:ring-[#ff6200]/10 transition-all"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  class="otp-input w-full h-14 sm:h-16 text-center text-2xl font-bold border border-gray-300 rounded-lg bg-white text-gray-900 outline-none focus:border-[#ff6200] focus:ring-4 focus:ring-[#ff6200]/10 transition-all"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  class="otp-input w-full h-14 sm:h-16 text-center text-2xl font-bold border border-gray-300 rounded-lg bg-white text-gray-900 outline-none focus:border-[#ff6200] focus:ring-4 focus:ring-[#ff6200]/10 transition-all"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  class="otp-input w-full h-14 sm:h-16 text-center text-2xl font-bold border border-gray-300 rounded-lg bg-white text-gray-900 outline-none focus:border-[#ff6200] focus:ring-4 focus:ring-[#ff6200]/10 transition-all"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  class="otp-input w-full h-14 sm:h-16 text-center text-2xl font-bold border border-gray-300 rounded-lg bg-white text-gray-900 outline-none focus:border-[#ff6200] focus:ring-4 focus:ring-[#ff6200]/10 transition-all"
                  required
                />
              </div>
              <span
                class="block mt-2 text-xs text-rose-600 min-h-[16px]"
                id="codeError"
                role="status"
                aria-live="polite"
              ></span>
            </div>

            <!-- BOTÃO PRINCIPAL -->
            <button
              type="submit"
              class="w-full h-[66px] rounded-full bg-gradient-to-r from-[#ff5800] to-[#ff6800] text-white text-xl font-bold cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-[#ff5e00]/25 active:translate-y-0"
            >
              Verificar Código
            </button>

            <!-- LINK VOLTAR -->
            <div class="text-center pt-2">
              <a
                href="../index.html"
                class="text-gray-500 text-base hover:text-gray-800 hover:underline"
              >
                ← Voltar
              </a>
            </div>
          </form>
        </div>
      </section>

      <!-- LADO DIREITO (ILUSTRAÇÃO E DECORAÇÕES) -->
      <section
        class="auth-artwork hidden lg:block absolute top-0 right-0 w-[60%] h-screen bg-gradient-to-br from-[#ff842c] via-[#e05c0f] to-[#b83d00] [clip-path:polygon(0_0,100%_0,100%_100%,46%_100%)] overflow-hidden z-20"
      >
        <!-- Círculos decorativos do fundo -->
        <div
          class="absolute w-[800px] h-[800px] rounded-full border border-white/15 right-10 top-[80px]"
        ></div>
        <div
          class="absolute w-[1050px] h-[1050px] rounded-full border border-white/15 -right-[100px] top-[30px]"
        ></div>

        <!-- Logo -->
        <div class="absolute right-[16px] -top-[10px] z-30">
          <img
            src="../assets/images/logocinza.png"
            alt="Logo SINSTOCK"
            class="w-[300px] h-[155px]"
          />
        </div>
      </section>

      <!-- ILUSTRAÇÃO PRINCIPAL -->
      <div
        class="auth-illustration hidden lg:block absolute top-[130px] right-[-140px] w-[81%] h-[96vh] z-30 pointer-events-none"
      >
        <img
          src="../assets/images/login.png"
          alt="Sistema SINSTOCK"
          class="w-[120%] h-[90%] object-contain"
        />
      </div>
    </main>

    <!-- SCRIPT PARA AVANÇAR AUTOMATICAMENTE AO DIGITAR -->
  </body>
</html>
