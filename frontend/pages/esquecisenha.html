<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci Minha Senha | SINSTOCK</title>
    <link rel="stylesheet" href="../assets/styles/autenticacao.css" />
    <script src="../js/core/config.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/auth/session.js"></script>
    <script src="../js/auth/forms.js" defer></script>
  </head>
  <body class="bg-white text-gray-900 font-sans antialiased min-h-screen">
    <main
      class="auth-page relative grid grid-cols-1 lg:grid-cols-[42%_58%] w-full min-h-screen overflow-hidden"
    >
      <section
        class="auth-panel relative w-full min-h-screen flex items-center justify-center px-8 lg:px-[70px] bg-white z-20"
      >
        <div class="auth-content w-full max-w-[445px] my-auto">
          <div class="mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900">
              Recuperar Senha
            </h1>
            <p class="mt-3 text-gray-600 text-base leading-relaxed">
              Informe seu e-mail cadastrado para receber as instruções de
              redefinição de senha.
            </p>
          </div>

          <form id="forgotForm" class="space-y-6">
            <div>
              <label
                for="email"
                class="block mb-2.5 text-lg font-normal text-gray-700"
                >E-mail Cadastrado</label
              >
              <div
                class="relative flex items-center w-full h-[68px] border border-gray-300 rounded-lg bg-white focus-within:border-[#ff6200] focus-within:ring-4 focus-within:ring-[#ff6200]/10 transition-all"
              >
                <svg
                  class="w-6 h-6 ml-5 text-gray-500 flex-shrink-0"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect width="20" height="16" x="2" y="4" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="seu-email@dominio.com"
                  required
                  class="w-full h-full border-0 outline-none bg-transparent pl-4 pr-4 text-lg text-gray-900 placeholder-gray-400"
                />
              </div>
            </div>

            <div class="flex justify-end">
              <a
                href="../index.html"
                class="text-[#ff5a00] text-base hover:text-[#df4e00] hover:underline"
                >← Voltar ao Login</a
              >
            </div>

            <button
              type="submit"
              class="w-full h-[66px] rounded-full bg-gradient-to-r from-[#ff5800] to-[#ff6800] text-white text-xl font-bold cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-[#ff5e00]/25"
            >
              Enviar Link
            </button>
          </form>
        </div>
      </section>

      <!-- LADO DIREITO (ILUSTRAÇÃO E DECORAÇÕES) -->
      <section
        class="auth-artwork hidden lg:block absolute top-0 right-0 w-[60%] h-screen bg-gradient-to-br from-[#ff842c] via-[#e05c0f] to-[#b83d00] [clip-path:polygon(0_0,100%_0,100%_100%,46%_100%)] overflow-hidden z-20"
      >
        <!-- Círculos decorativos do fundo -->
        <div
          class="absolute w-[800px] h-[800px] rounded-full border border-white/15 right-10 top-[80px]"
        ></div>
        <div
          class="absolute w-[1050px] h-[1050px] rounded-full border border-white/15 -right-[100px] top-[30px]"
        ></div>

        <!-- Logo -->
        <div class="absolute right-[16px] -top-[10px] z-30">
          <img
            src="../assets/images/logocinza.png"
            alt="Logo SINSTOCK"
            class="w-[300px] h-[155px]"
          />
        </div>
      </section>

      <!-- ILUSTRAÇÃO PRINCIPAL -->
      <div
        class="auth-illustration hidden lg:block absolute top-[130px] right-[-140px] w-[81%] h-[96vh] z-30 pointer-events-none"
      >
        <img
          src="../assets/images/login.png"
          alt="Sistema SINSTOCK"
          class="w-[120%] h-[90%] object-contain"
        />
      </div>
    </main>
  </body>
</html>
