<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SINSTOCK</title>

    <link rel="stylesheet" href="./assets/styles/login.css">
    <link rel="stylesheet" href="./assets/styles/shared.css">
  <script src="./js/core/config.js"></script>
  <script src="./js/core/api.js"></script>
  <script src="./js/auth/session.js"></script>
  <script src="./js/auth/login.js" defer></script>
</head>

<body>

    <main class="login-page">

        <!-- =========================
             LADO ESQUERDO
        ========================== -->
        <section class="login-left">

            <div class="language">
                <span>Português (BR)</span>

                <i data-lucide="chevron-down" width="18" height="18" aria-hidden="true"></i>
            </div>


            <div class="login-container">

                <div class="login-header">
                    <h1>Autenticação</h1>
                    <p>Entre com seus dados para acessar o sistema.</p>
                </div>


                <form id="loginForm">

                    <!-- USUÁRIO -->
                    <div class="form-group">

                        <label for="usuario">
                            E-mail
                        </label>

                        <div class="input-box">

                            <i class="input-icon" data-lucide="user" aria-hidden="true"></i>

                            <input
                                type="email"
                                id="usuario"
                                name="usuario"
                                placeholder="seu-email@dominio.com"
                                autocomplete="username" required
                            >

                        </div>

                        <span
                            class="error-message"
                            id="usuarioError"
                        ></span>

                    </div>


                    <!-- SENHA -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-box">

                            <i class="input-icon" data-lucide="lock" aria-hidden="true"></i>

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Informe sua senha"
                                autocomplete="current-password" required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Mostrar senha"
                            >

                                <i id="eyeIcon" data-lucide="eye" aria-hidden="true"></i>

                            </button>

                        </div>

                        <span
                            class="error-message"
                            id="senhaError"
                        ></span>

                    </div>


                    <!-- ESQUECI SENHA -->
                    <div class="forgot-password">

                        <a href="./pages/esquecisenha.html" id="forgotPassword">
                            Esqueci minha senha
                        </a>

                    </div>


                    <!-- MENSAGEM -->
                    <div
                        id="loginMessage" role="status" aria-live="polite"
                        class="login-message"
                    ></div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Entrar
                    </button>

                </form>

            </div>

        </section>



        <!-- =========================
             LADO DIREITO
        ========================== -->
        <section class="login-right">

            <div class="background-circle circle-one"></div>
            <div class="background-circle circle-two"></div>


            <div class="logo">

                <img
                    src="assets/images/logocinza.png"
                    alt="Logo SINSTOCK"
                >

            </div>

        </section>

            <div class="illustration-container">

                <img
                    src="assets/images/login.png"
                    alt="Sistema de gerenciamento de estoque SINSTOCK"
                >

            </div>


            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>


    </main>

<script src="./assets/vendor/lucide.min.js"></script>
<script>if (window.lucide) window.lucide.createIcons();</script>
</body>
</html>
