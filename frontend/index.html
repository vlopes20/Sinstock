<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SINSTOCK</title>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- =========================
             LADO ESQUERDO
        ========================== -->
        <section class="login-left">

            <div class="language">
                <span>Português (BR)</span>

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </div>


            <div class="login-container">

                <div class="login-header">
                    <h1>Autenticação</h1>
                    <p>Entre com seus dados para acessar o sistema.</p>
                </div>


                <form id="loginForm">

                    <!-- USUÁRIO -->
                    <div class="form-group">

                        <label for="usuario">
                            Usuário
                        </label>

                        <div class="input-box">

                            <svg
                                class="input-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >
                                <path d="M20 21a8 8 0 0 0-16 0"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>

                            <input
                                type="text"
                                id="usuario"
                                name="usuario"
                                placeholder="Informe seu usuário"
                                autocomplete="username"
                            >

                        </div>

                        <span
                            class="error-message"
                            id="usuarioError"
                        ></span>

                    </div>


                    <!-- SENHA -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-box">

                            <svg
                                class="input-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >
                                <rect
                                    width="18"
                                    height="11"
                                    x="3"
                                    y="11"
                                    rx="2"
                                />

                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Informe sua senha"
                                autocomplete="current-password"
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Mostrar senha"
                            >

                                <svg
                                    id="eyeIcon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696C3.54 7.61 7.33 5 12 5c4.67 0 8.46 2.61 9.938 6.652a1 1 0 0 1 0 .696C20.46 16.39 16.67 19 12 19c-4.67 0-8.46-2.61-9.938-6.652Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />
                                </svg>

                            </button>

                        </div>

                        <span
                            class="error-message"
                            id="senhaError"
                        ></span>

                    </div>


                    <!-- ESQUECI SENHA -->
                    <div class="forgot-password">

                        <a href="#">
                            Esqueci minha senha
                        </a>

                    </div>


                    <!-- MENSAGEM -->
                    <div
                        id="loginMessage"
                        class="login-message"
                    ></div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Entrar
                    </button>

                </form>

            </div>

        </section>



        <!-- =========================
             LADO DIREITO
        ========================== -->
        <section class="login-right">

            <div class="background-circle circle-one"></div>
            <div class="background-circle circle-two"></div>


            <div class="logo">

                <img
                    src="assets/images/logocinza.png"
                    alt="Logo SINSTOCK"
                >

            </div>

        </section>

            <div class="illustration-container">

                <img
                    src="assets/images/login.png"
                    alt="Sistema de gerenciamento de estoque SINSTOCK"
                >

            </div>


            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>


    </main>


    <script src="./js/login.js"></script>

</body>
</html>
